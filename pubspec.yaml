name: abhaya
description: "Abhaya: Proactive Safety, Biometric Monitoring & Live Mapping Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.2.1
  permission_handler: ^11.3.0
  intl: ^0.19.0 # Added this as your code uses DateFormat

  # --- GUARDIAN AI CORE PACKAGES ---
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  firebase_core: ^4.4.0
  firebase_database: ^12.1.3

  # --- NEW: EMERGENCY & NETWORK TOOLS ---
  http: ^1.2.1
  url_launcher: ^6.3.2
  flutter_polyline_points: ^2.1.0
  google_generative_ai: ^0.4.7
  speech_to_text: ^7.3.0
  connectivity_plus: ^7.0.0
  sqflite: ^2.4.2
  path: ^1.9.1
  google_maps_flutter: ^2.15.0
  provider: ^6.1.5+1
  record: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3 # Moved to dev_dependencies (best practice)

# --- APP ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png" # Path updated to your assets folder
  adaptive_icon_background: "#F44336" # Red Accent to match your SOS theme
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/